{% extends 'base.html' %}

{% block content %}
    <h1>Add Movie</h1>

    <form method="POST">
        {% csrf_token %}
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Movie Title" required />

        <label for="genre">Genre</label>
        <input type="text" id="genre" name="genre" placeholder="Movie Genre" required />

        <label for="platform">Platform</label>
        <input type="text" id="platform" name="platform" placeholder="Movie Platform" required />

        <label for="is_finished">Is Finished ?</label>
        <input type="checkbox" id="is_finished" name="is_finished" />

        <label for="rating">Rate</label>
        <input type="number" id="rating" name="rating" min="1" max="10" placeholder="Movie Rating" required />

        <input type="submit" value="Add Movie" />

    </form>
{% endblock %}
