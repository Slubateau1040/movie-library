<h1>Edit Movie</h1>

<form method="POST">
    {% csrf_token %}

    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{movie.title}}" required>

    <label for="genre">Genre</label>
    <input type="text" id="genre" name="genre" value="{{ movie.genre }}" required />

    <label for="platform">Platform</label>
    <input type="text" id="platform" name="platform" value="{{ movie.platform }}" required />

    <label for="is_finished">Is Finished ?</label>
    <input type="checkbox" id="is_finished" name="is_finished" {% if movie.is_finished %}checked{% endif %} />

    <label for="rating">Rate</label>
    <input type="text" id="rating" name="rating" value="{{ movie.rating }}" required />

    <input type="submit" value="Save" />
</form>
